<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BAPC Security Operations Center</title>
<style>
  :root{color-scheme:light dark;}
  body{font-family:system-ui,sans-serif;margin:0;background:#0b0f14;color:#e6edf3;}
  header{padding:16px 24px;border-bottom:1px solid #22282f;display:flex;gap:16px;align-items:center;flex-wrap:wrap;}
  header h1{font-size:16px;margin:0;font-weight:600;}
  header input{background:#161b22;border:1px solid #30363d;color:#e6edf3;padding:6px 10px;border-radius:6px;width:360px;}
  header button{background:#238636;border:none;color:white;padding:6px 14px;border-radius:6px;cursor:pointer;}
  main{padding:24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;}
  .card{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:16px;}
  .card h2{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:#8b949e;margin:0 0 10px;}
  .stat{font-size:28px;font-weight:700;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:4px 6px;border-bottom:1px solid #21262d;}
  .full{grid-column:1/-1;}
  .sev-CRITICAL,.sev-EMERGENCY{color:#f85149;}
  .sev-WARN{color:#d29922;}
  .sev-INFO{color:#8b949e;}
  .err{color:#f85149;font-size:12px;}
  button.action{background:#21262d;border:1px solid #30363d;color:#e6edf3;border-radius:6px;padding:3px 8px;cursor:pointer;font-size:12px;}
</style>
</head>
<body>
<header>
  <h1>BAPC Security Operations Center</h1>
  <input id="baseUrl" placeholder="Control API base URL, e.g. http://127.0.0.1:8080" value="http://127.0.0.1:8080">
  <input id="token" placeholder="Bearer token" type="password">
  <button id="connect">Connect</button>
  <span id="status" class="err"></span>
</header>
<main>
  <div class="card"><h2>Devices</h2><div class="stat" id="statDevices">–</div></div>
  <div class="card"><h2>Active Nodes</h2><div class="stat" id="statNodes">–</div></div>
  <div class="card"><h2>Active JIT Grants</h2><div class="stat" id="statJit">–</div></div>
  <div class="card"><h2>Active Policies</h2><div class="stat" id="statPolicies">–</div></div>
  <div class="card"><h2>Compromised Devices</h2><div class="stat" id="statCompromised">–</div></div>
  <div class="card"><h2>Critical Events</h2><div class="stat" id="statCritical">–</div></div>

  <div class="card full">
    <h2>Mesh Nodes</h2>
    <table id="nodesTable"><thead><tr><th>ID</th><th>Zone</th><th>Type</th><th>Active</th><th>Actions</th></tr></thead><tbody></tbody></table>
  </div>

  <div class="card full">
    <h2>Recent Security Events</h2>
    <table id="eventsTable"><thead><tr><th>Time</th><th>Severity</th><th>Engine</th><th>Type</th><th>Description</th></tr></thead><tbody></tbody></table>
  </div>
</main>
<script>
let base = "", token = "";

async function api(path, opts = {}) {
  const res = await fetch(base + path, {
    ...opts,
    headers: { "authorization": `Bearer ${token}`, "content-type": "application/json", ...(opts.headers || {}) }
  });
  const body = await res.json();
  if (!res.ok) throw new Error(body.error?.message || `request failed (${res.status})`);
  return body.data;
}

function row(cells) {
  const tr = document.createElement("tr");
  for (const c of cells) {
    const td = document.createElement("td");
    if (c instanceof Node) td.appendChild(c); else td.textContent = c;
    tr.appendChild(td);
  }
  return tr;
}

function actionButton(label, onClick) {
  const btn = document.createElement("button");
  btn.className = "action"; btn.textContent = label; btn.onclick = onClick;
  return btn;
}

async function refresh() {
  document.getElementById("status").textContent = "";
  try {
    const snapshot = await api("/api/v1/soc/snapshot");
    document.getElementById("statDevices").textContent = snapshot.counts.devices;
    document.getElementById("statNodes").textContent = snapshot.counts.activeNodes;
    document.getElementById("statJit").textContent = snapshot.counts.activeJit;
    document.getElementById("statPolicies").textContent = snapshot.counts.activePolicies;
    document.getElementById("statCompromised").textContent = snapshot.counts.compromisedDevices;
    document.getElementById("statCritical").textContent = snapshot.counts.criticalEvents;

    const nodesBody = document.querySelector("#nodesTable tbody");
    nodesBody.innerHTML = "";
    for (const n of snapshot.nodes) {
      nodesBody.appendChild(row([
        n.id.slice(0, 8), n.zone, n.nodeType, n.active ? "yes" : "no",
        actionButton("Quarantine", async () => {
          const reason = prompt("Quarantine reason (min 12 chars):");
          if (!reason) return;
          await api(`/api/v1/nodes/${n.id}/quarantine`, { method: "POST", body: JSON.stringify({ reason }) });
          refresh();
        })
      ]));
    }

    const eventsBody = document.querySelector("#eventsTable tbody");
    eventsBody.innerHTML = "";
    for (const e of snapshot.events.slice(0, 25)) {
      const sev = document.createElement("span");
      sev.className = `sev-${e.severity}`; sev.textContent = e.severity;
      eventsBody.appendChild(row([new Date(e.at).toLocaleString(), sev, e.engine, e.type, e.description]));
    }
  } catch (err) {
    document.getElementById("status").textContent = err.message;
  }
}

document.getElementById("connect").onclick = () => {
  base = document.getElementById("baseUrl").value.replace(/\/$/, "");
  token = document.getElementById("token").value;
  refresh();
  clearInterval(window.__pollTimer);
  window.__pollTimer = setInterval(refresh, 10000);
};
</script>
</body>
</html>
