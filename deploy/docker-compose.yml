x-app-image: &app-image
  build:
    context: ..
    dockerfile: deploy/Dockerfile
x-control-env: &control-env
  NODE_ENV: production
  DATABASE_URL: postgres://bapc_security:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/bapc_security_core
  CONTROL_API_TOKEN_SECRET: ${CONTROL_API_TOKEN_SECRET:?set CONTROL_API_TOKEN_SECRET, >=32 chars}
  EVENT_SIGNING_SECRET: ${EVENT_SIGNING_SECRET:?set EVENT_SIGNING_SECRET, >=32 chars}
  OOB_SHARED_SECRET: ${OOB_SHARED_SECRET:?set OOB_SHARED_SECRET, >=32 chars, different from CONTROL_API_TOKEN_SECRET}
  DIAGNOSTICS_SHARED_SECRET: ${DIAGNOSTICS_SHARED_SECRET:-development-diagnostics-secret-change-me}
  HEADQUARTERS_SHARED_SECRET: ${HEADQUARTERS_SHARED_SECRET:-development-headquarters-secret-change-me}
  CLOUD_DEPLOYMENT_SHARED_SECRET: ${CLOUD_DEPLOYMENT_SHARED_SECRET:-development-cloud-deployment-secret-change-me}
  INTEGRATION_SHARED_SECRET: ${INTEGRATION_SHARED_SECRET:-development-integration-secret-change-me}
  # loadConfig (src/config.ts) refuses to start ANY service with
  # NODE_ENV=production (which this compose file sets unconditionally)
  # unless ATTESTATION_PROVIDER is explicitly windows-tpm, linux-tpm2, or
  # apple-secure-enclave — "development" (the allow-all mock,
  # src/infrastructure/attestation/providers.ts) throws even if explicitly
  # requested, by design: there is no NODE_ENV-based mock escape hatch for
  # production. This compose file has no real TPM/Secure Enclave hardware
  # behind it, so real enrollment quotes will correctly fail closed here —
  # see deploy/.env for which real provider this deployment is configured
  # to expect evidence from.
  ATTESTATION_PROVIDER: ${ATTESTATION_PROVIDER:?set ATTESTATION_PROVIDER to windows-tpm, linux-tpm2, or apple-secure-enclave}

# Three networks. An earlier version of this file used two (control/egress)
# on the theory that `internal: true` meant "no outbound internet" — but
# actually verifying this against a real Docker daemon (not just `compose
# config`, which only validates YAML/schema and can't catch this) showed
# `internal: true` ALSO silently disables inbound `ports:` publishing
# entirely, because Docker's NAT-based port publishing requires the same
# gateway route that "internal" removes. That made control-api, mesh-grpc,
# oob-controller and soc-console — services that exist specifically to be
# reached from outside the Docker network — completely unreachable from the
# host, while `docker compose ps` still showed them as "Up (healthy)" since
# their healthchecks run inside the container's own namespace. Fixed by
# splitting "needs no reachability at all, in or out" from "needs host
# reachability but not internet":
#   control  — internal-only. Only Postgres, the one-shot migrate job, and
#              the maintenance-worker background loop — none of them are
#              ever dialed from outside this compose project.
#   api      — a normal bridge (host ports work), but nothing here gets an
#              `egress` membership, so no outbound internet either — for the
#              client/operator-facing services: control-api, mesh-grpc,
#              oob-controller, soc-console.
#   egress   — a normal bridge WITH internet access, for the three services
#              whose job actually requires it: secure-dns (DoH upstream),
#              blind-relay (relays real traffic to/from internet peers) and
#              egress-gateway (its entire purpose is proxying traffic out).
# blind-relay and egress-gateway are also on `api`, in addition to
# `egress`: both self-register and heartbeat against control-api's REST API
# (POST /api/v1/relays|egress/register, /:id/heartbeat — see
# src/runtime/relay-server.ts and egress-server.ts) so RelayRoutingService/
# EgressSelector have real candidates to select, which needs them to reach
# control-api the same way mesh-grpc/oob-controller/soc-console do.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bapc_security_core
      POSTGRES_USER: bapc_security
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - security-db:/var/lib/postgresql/data
    networks: [control]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U bapc_security"], interval: 10s, timeout: 5s, retries: 5}

  # One-shot: applies db/*.sql (checksum-tracked, advisory-locked — see
  # src/infrastructure/postgres/migrate.ts) then exits. Every service that
  # touches the database waits for this to complete successfully first.
  migrate:
    <<: *app-image
    environment: *control-env
    networks: [control]
    depends_on:
      postgres: {condition: service_healthy}
    command: ["node", "dist/src/runtime/migrate-cli.js", "db", "up"]
    restart: "no"

  control-api:
    <<: *app-image
    environment: {<<: *control-env, BIND_HOST: "0.0.0.0", PORT: "8080", OOB_CONTROLLER_URL: "http://oob-controller:8181"}
    networks: [control, api]
    depends_on:
      migrate: {condition: service_completed_successfully}
    command: ["node", "dist/src/runtime/production-server.js"]
    ports: ["8080:8080"]
    healthcheck: {test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"], interval: 15s, timeout: 5s, retries: 5}

  mesh-grpc:
    <<: *app-image
    environment: {<<: *control-env, BIND_HOST: "0.0.0.0", GRPC_PORT: "50051"}
    networks: [control, api]
    depends_on:
      migrate: {condition: service_completed_successfully}
    command: ["node", "dist/src/runtime/grpc-server.js"]
    ports: ["50051:50051"]

  oob-controller:
    <<: *app-image
    environment: {<<: *control-env, OOB_BIND_HOST: "0.0.0.0", OOB_PORT: "8181"}
    networks: [control, api]
    depends_on:
      migrate: {condition: service_completed_successfully}
    command: ["node", "dist/src/runtime/oob-server.js"]
    ports: ["8181:8181"]

  # Drains the transactional outbox and runs partition/retention maintenance
  # (src/runtime/maintenance-worker.ts) — without this, published events
  # accumulate in event_outbox forever and are never delivered.
  maintenance-worker:
    <<: *app-image
    environment: *control-env
    networks: [control]
    depends_on:
      migrate: {condition: service_completed_successfully}
    command: ["node", "dist/src/runtime/maintenance-worker.js"]

  soc-console:
    <<: *app-image
    environment: {ADMIN_CONSOLE_BIND_HOST: "0.0.0.0"}
    networks: [api]
    command: ["node", "dist/src/runtime/admin-console-server.js"]
    ports: ["8090:8090"] # static file server only — no database, no secrets

  secure-dns:
    <<: *app-image
    environment: {<<: *control-env, DNS_BIND_HOST: "0.0.0.0", DNS_PORT: "5353"}
    networks: [control, egress]
    depends_on:
      migrate: {condition: service_completed_successfully}
    command: ["node", "dist/src/runtime/dns-server.js"]
    ports: ["5353:5353/udp"]

  blind-relay:
    <<: *app-image
    environment:
      NODE_ENV: production
      RELAY_BIND_HOST: "0.0.0.0"
      RELAY_PORT: "51900"
      # Registration/heartbeat is entirely optional (relay-server.ts skips
      # it cleanly if any of these five are unset) — set RELAY_AGENT_TOKEN
      # (mint with `npm run token -- --roles security-agent`) to enable it.
      RELAY_ID: "0a2e90eb-ff1b-47e7-9224-6c633c21883c" # fixed: relays.relay_id is a uuid column
      RELAY_REGION: "local"
      RELAY_PUBLIC_ENDPOINT: "blind-relay:51900"
      BAPC_CONTROLLER_URL: "http://control-api:8080"
      BAPC_AGENT_TOKEN: ${RELAY_AGENT_TOKEN:-}
    networks: [egress, api] # egress to relay real traffic; api to reach control-api for registration
    command: ["node", "dist/src/runtime/relay-server.js"]
    ports: ["51900:51900/udp"]

  egress-gateway:
    <<: *app-image
    environment:
      NODE_ENV: production
      EGRESS_BIND_HOST: "0.0.0.0"
      EGRESS_PORT: "1080"
      # Registration/heartbeat is entirely optional (egress-server.ts skips
      # it cleanly if any of these five are unset) — set EGRESS_AGENT_TOKEN
      # (mint with `npm run token -- --roles security-agent`) to enable it.
      EGRESS_ID: "c7275156-d439-421d-beab-8d37f12480e3"
      EGRESS_REGION: "local"
      EGRESS_FIXED_IP: "egress-gateway:1080"
      BAPC_CONTROLLER_URL: "http://control-api:8080"
      BAPC_AGENT_TOKEN: ${EGRESS_AGENT_TOKEN:-}
    networks: [egress, api] # egress to proxy real traffic; api to reach control-api for registration
    command: ["node", "dist/src/runtime/egress-server.js"]
    ports: ["1080:1080"]

networks:
  control: {internal: true}
  api: {}
  egress: {}
volumes: {security-db: {}}
