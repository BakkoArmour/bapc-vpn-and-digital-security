services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bapc_security_core
      POSTGRES_USER: bapc_security
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - security-db:/var/lib/postgresql/data
      - ../db/001_security_core.sql:/docker-entrypoint-initdb.d/001.sql:ro
    networks: [control]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U bapc_security"], interval: 10s, timeout: 5s, retries: 5}
networks: {control: {internal: true}}
volumes: {security-db: {}}
