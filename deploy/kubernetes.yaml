# Minimal example for the control-plane API only, built from
# deploy/Dockerfile. The other six services (mesh-grpc, secure-dns,
# blind-relay, egress-gateway, oob-controller, soc-console) run the same
# image with a different command/port — see deploy/docker-compose.yml for
# the complete multi-service reference (including the required Secret keys
# and the internal-vs-egress network split) that this manifest doesn't
# reproduce; add the equivalent Deployment/Service pair per service,
# a NetworkPolicy mirroring that internal/egress split, and a Secret named
# bapc-security-control with the CONTROL_API_TOKEN_SECRET/EVENT_SIGNING_SECRET/
# OOB_SHARED_SECRET/DIAGNOSTICS_SHARED_SECRET/etc. keys from .env.example
# before applying this for real.
apiVersion: apps/v1
kind: Deployment
metadata: {name: bapc-security-control, namespace: bapc-security}
spec:
  replicas: 3
  selector: {matchLabels: {app: bapc-security-control}}
  template:
    metadata: {labels: {app: bapc-security-control}}
    spec:
      serviceAccountName: bapc-security-control
      containers:
        - name: control
          image: registry.bapc.internal/security/control:0.4.0
          ports: [{containerPort: 8080}]
          envFrom: [{secretRef: {name: bapc-security-control}}]
          readinessProbe: {httpGet: {path: /healthz, port: 8080}, initialDelaySeconds: 3, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /healthz, port: 8080}, initialDelaySeconds: 10, periodSeconds: 20}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, capabilities: {drop: ["ALL"]}}
---
apiVersion: v1
kind: Service
metadata: {name: bapc-security-control, namespace: bapc-security}
spec: {selector: {app: bapc-security-control}, ports: [{port: 8080, targetPort: 8080}]}
